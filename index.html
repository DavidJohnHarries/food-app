<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0f17"><title>Food Log</title>
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
<style>
*{box-sizing:border-box}html,body,button,input,select,textarea,.ex,a{touch-action:manipulation}body{margin:0;font:17px -apple-system,system-ui,sans-serif;background:#0b0f17;color:#e5e7eb;padding:env(safe-area-inset-top) 0 calc(120px + env(safe-area-inset-bottom))}
header{padding:14px 16px;font-size:22px;font-weight:700}main{padding:0 12px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#111827;border-top:1px solid #1f2937;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:#9ca3af;font-size:16px;padding:18px 0}nav button.on{color:#22c55e;font-weight:700}
.card{background:#111827;border-radius:14px;padding:14px;margin:10px 0}
button{font:inherit;border-radius:12px;border:0;cursor:pointer}
.btn{background:#22c55e;color:#04120a;font-weight:700;padding:14px 18px;min-height:50px}.btn.sec{background:#1f2937;color:#e5e7eb}.btn.danger{background:#7f1d1d;color:#fee2e2}
.full{width:100%;margin:6px 0}
.ex{display:flex;align-items:center;justify-content:space-between;padding:14px;margin:6px 0;background:#111827;border-radius:12px;min-height:56px}
.ex .name{flex:1}.ex small{color:#9ca3af;display:block}
.x{background:#1f2937;color:#f87171;width:44px;height:44px;font-size:20px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0}.row label{width:70px;color:#9ca3af;font-size:15px}
.step{background:#1f2937;color:#e5e7eb;width:52px;height:52px;font-size:26px}
.row input{flex:1;min-width:0;height:52px;text-align:center;font-size:22px;background:#0b0f17;color:#fff;border:1px solid #374151;border-radius:12px}
input[type=text],textarea,select{width:100%;padding:12px;font-size:17px;background:#0b0f17;color:#fff;border:1px solid #374151;border-radius:12px}
textarea{min-height:80px}h3{margin:4px 0 8px;display:flex;justify-content:space-between;align-items:center}
pre{white-space:pre-wrap;background:#0b0f17;padding:12px;border-radius:12px;font-size:15px}
.muted{color:#9ca3af}.hidden{display:none}.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:#000;padding:10px 16px;border-radius:10px}
.ex.sel{background:#0f2e1c;box-shadow:inset 0 0 0 2px #22c55e}.ex .mark{color:#22c55e;font-size:26px;width:30px;text-align:center}.ex.sel .mark{font-weight:700}
.lr{gap:6px;padding:8px}.handle{touch-action:none;user-select:none;-webkit-user-select:none;font-size:24px;color:#6b7280;width:44px;height:48px;display:flex;align-items:center;justify-content:center;cursor:grab}
.mv{background:#1f2937;color:#e5e7eb;width:40px;height:44px;font-size:16px}.lr.dragging{position:relative;z-index:5;background:#1f2937;box-shadow:0 8px 20px #0008;opacity:.95}
.ex [data-val]{color:#86efac}.nudge{animation:nudge .25s}@keyframes nudge{0%,100%{transform:none}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.unsel{background:#14532d;border:0;color:#bbf7d0;width:48px;height:48px;min-width:44px;border-radius:12px;font-size:24px;font-weight:700;margin:-4px -4px -4px 8px}
.vlink{display:inline-block;padding:8px 10px 8px 0;margin:-8px 0;text-decoration:underline dotted;text-underline-offset:3px}
.flash{animation:flash 1s}@keyframes flash{0%,40%{box-shadow:0 0 0 3px #22c55e}100%{box-shadow:0 0 0 0 transparent}}
.ex .name{min-width:0}.amt{display:flex;align-items:center;gap:6px;margin-top:6px}.amt .s{background:#1f2937;color:#e5e7eb;width:44px;height:44px;font-size:22px}
.amt .v{min-width:84px;text-align:center;color:#86efac;font-size:16px}.mv2{display:flex;flex-direction:column;gap:4px}.mv2 .mv{height:30px;width:40px;font-size:13px}
.ed{background:#1f2937;color:#e5e7eb;width:44px;height:44px;font-size:18px}.tog{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:17px}.tog input{width:26px;height:26px}
textarea{font-family:inherit}
.datebar{display:flex;align-items:center;justify-content:space-between;background:#111827;border-radius:14px;padding:6px;margin:4px 0 10px;position:sticky;top:env(safe-area-inset-top);z-index:3}
.datebar.past{background:#92400e;color:#fff7ed}.dnav{background:#1f2937;color:#e5e7eb;width:52px;height:48px;font-size:28px}.datebar.past .dnav{background:#b45309;color:#fff}
.dnav:disabled{opacity:.3}.dlabel{font-weight:700;font-size:18px}.pastban{background:#451a03;color:#fdba74;border:1px solid #b45309;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-weight:600}
.btn.pastbtn{background:#f59e0b;color:#1c1003}
.pastban{display:flex;justify-content:space-between;align-items:center;gap:8px}.todayban{background:#111827;border-radius:12px;padding:10px 12px;margin:0 0 10px;font-weight:600}
.stat{border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px;white-space:nowrap}.stat.ok{background:#16a34a;color:#fff}.stat.no{background:#dc2626;color:#fff}
</style></head><body>
<header id="title">Today</header><main id="app"></main>
<nav><button data-v="log">Log</button><button data-v="items">Items</button><button data-v="hist">History</button></nav>
<script src="app.js?v=5"></script></body></html>
